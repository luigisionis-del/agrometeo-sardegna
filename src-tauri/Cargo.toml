[workspace]
members = ["core"]

[package]
name = "agrometeo-sardegna"
version = "0.4.0"
description = "Agrometeo Sardegna - Decision Support System agrometeorologico per la Sardegna"
authors = ["Luigi Sionis"]
license = "MIT"
edition = "2024"

[lib]
name = "agrometeo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.12.4", features = [] }
agrometeo-core = { path = "core" }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
