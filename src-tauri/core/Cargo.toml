[package]
name = "agrometeo-core"
version = "0.4.0"
description = "Motore agrometeorologico di Agrometeo Sardegna (senza interfaccia)"
authors = ["Luigi Sionis"]
license = "MIT"
edition = "2024"

[lib]
name = "agrometeo_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# Su Android il verificatore TLS di piattaforma (rustls-platform-verifier) richiede
# un'inizializzazione JNI: si usano invece le radici Mozilla incluse nel binario.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
